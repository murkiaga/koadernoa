<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="eu">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Ikaslearen tutoretza-fitxa</title>
  <link rel="stylesheet" th:href="@{/css/navbar.css}"><link rel="stylesheet" th:href="@{/css/irakasle-navbar.css}"><link rel="stylesheet" th:href="@{/css/irakasle-common.css}">
  <style>.ikasle-goiburua{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:2rem;align-items:start;margin-bottom:1rem}.ikasle-datuak{table-layout:fixed;width:100%}.ikasle-datuak th{width:190px}.ikasle-argazkia-card{width:260px;aspect-ratio:4/5;padding:6px;background:#fff;border:1px solid #e2e8f0;border-radius:18px;box-shadow:0 8px 24px rgba(15,23,42,.10);overflow:hidden}.ikasle-argazkia{width:100%;height:100%;object-fit:cover;border-radius:12px}.falta-pct-altua{background:#fecaca}.falta-pct-ertaina{background:#fef9c3}.egoera-pendiente{color:#dc2626;font-weight:700}.profile-nav{display:flex;margin:1rem 0}.matrikula-ekintzak{margin-top:1rem;display:flex;justify-content:flex-end}@media(max-width:900px){.ikasle-goiburua{grid-template-columns:1fr}.ikasle-argazkia-card{width:min(240px,70vw);justify-self:center}}</style>
</head>
<body><div th:replace="~{irakasleak/fragments/irakasle-navbar :: navbar(${koadernoAktiboa}, ${irakasleKoadernoAktiboak})}"></div>
<main class="page">
  <nav class="profile-nav"><a class="btn btn-secondary" th:href="@{/irakasle/tutore/{taldeaId}(taldeaId=${taldea.id})}">← Taldeko ikasleak</a></nav>
  <h1 th:text="${ikaslea.izenOsoa}">Ikaslearen fitxa</h1><p th:text="${ikasturtea.izena} + ' · Ikasturte aktiboa'">Ikasturte aktiboa</p>
  <div class="ikasle-goiburua"><div class="table-wrap"><table class="ikasle-datuak"><tbody>
    <tr><th>Izena</th><td th:text="${ikaslea.izena != null ? ikaslea.izena : '-'}">-</td></tr><tr><th>Abizena 1</th><td th:text="${ikaslea.abizena1 != null ? ikaslea.abizena1 : '-'}">-</td></tr><tr><th>Abizena 2</th><td th:text="${ikaslea.abizena2 != null ? ikaslea.abizena2 : '-'}">-</td></tr><tr><th>HNA (DIE)</th><td th:text="${ikaslea.hna != null ? ikaslea.hna : '-'}">-</td></tr><tr><th>NAN (DNI)</th><td th:text="${ikaslea.nan != null ? ikaslea.nan : '-'}">-</td></tr><tr><th>Taldea</th><td th:text="${taldea.izena}">-</td></tr><tr><th>Zikloa</th><td th:text="${taldea.zikloa != null ? taldea.zikloa.izena : '-'}">-</td></tr>
  </tbody></table></div><div class="ikasle-argazkia-card"><th:block th:with="tick=${#dates.createNow().time / 300000}"><img class="ikasle-argazkia" th:src="${#strings.isEmpty(ikaslea.argazkiPath) ? '/img/avatar-user.svg' : ikaslea.argazkiPath + '?v=' + tick}" th:alt="${ikaslea.izena + ' - argazkia'}"></th:block></div></div>
  <h2>Matrikulak</h2><div class="table-wrap"><table><thead><tr><th>Modulua</th><th>Taldea</th><th th:each="momentua : ${ebaluazioMomentuak}" th:text="${momentua.izena}">Ebaluazioa</th><th>Hutsegiteak (%)</th><th>Egoera</th></tr></thead><tbody>
    <tr th:each="row : ${matrikulak}" th:with="m=${row.matrikula}"><td th:text="${m.koadernoa.moduloa.izena}">-</td><td th:text="${m.koadernoa.moduloa.taldea != null ? m.koadernoa.moduloa.taldea.izena : '-'}">-</td><td th:each="momentua : ${ebaluazioMomentuak}" th:text="${row.ebaluazioMomentuKodeak.contains(momentua.kodea) ? (#maps.containsKey(row.kalifikazioak, momentua.kodea) and !#strings.isEmpty(row.kalifikazioak[momentua.kodea]) ? row.kalifikazioak[momentua.kodea] : '-') : '-'}">-</td><td th:classappend="${row.hutsegitePortzentaia > m.koadernoa.moduloa.maila.faltenMugaPortzentaia ? ' falta-pct-altua' : (row.hutsegitePortzentaia >= 10 ? ' falta-pct-ertaina' : '')}" th:text="${#numbers.formatDecimal(row.hutsegitePortzentaia, 1, 2)} + '%'">0%</td><td th:classappend="${m.egoera != null and m.egoera.name() == 'PENDIENTE_AURREKO_URTETIK' ? ' egoera-pendiente' : ''}" th:text="${m.egoera != null ? m.egoera.etiketa : '-'}">-</td></tr>
    <tr th:if="${#lists.isEmpty(matrikulak)}"><td th:colspan="${4 + #lists.size(ebaluazioMomentuak)}">Ez dago matrikularik ikasturte aktiboan.</td></tr>
  </tbody></table></div><div class="matrikula-ekintzak"><a class="btn btn-primary" th:href="@{/irakasle/tutore/{taldeaId}/{ikasleaId}/asistentzia-kontrola(taldeaId=${taldea.id},ikasleaId=${ikaslea.id})}">Asistentzia kontrola</a></div>
</main></body></html>
