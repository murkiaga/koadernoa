<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="eu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ethazi koadernoa — Denboralizazioa</title>
  <link rel="stylesheet" th:href="@{/css/irakasle-navbar.css}">
  <link rel="stylesheet" th:href="@{/css/irakasle-common.css}">
  <link rel="stylesheet" th:href="@{/css/ethazi-koadernoa.css}">
  <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}">
  <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}">
  <style>
    *{box-sizing:border-box}
    .denb-page{max-width:none;width:100%;margin:.5rem auto;padding:0 .5rem}
    .denb-card{background:#fff;border:1px solid var(--b);border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.04);overflow:hidden}
    .denb-header{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;padding:.65rem .8rem;border-bottom:1px solid var(--b);flex-wrap:wrap}
    .denb-header h1{margin:0}.muted{color:#64748b;margin-top:.3rem}
    .denb-filter{display:grid;gap:.3rem;min-width:240px;color:#475569;font-size:.78rem;font-weight:800}
    .denb-filter select{width:100%;padding:.55rem .7rem;border:1px solid #cbd5e1;border-radius:8px;background:#fff;color:#172033;font:inherit}
    .month-nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:1rem;padding:.75rem .8rem;background:#fff;border-bottom:0}
    .month-nav h2{margin:0;text-transform:capitalize;font-size:1.15rem;text-align:center}
    .month-nav a{color:#1d4ed8;font-weight:800;text-decoration:none}.month-nav a:last-child{text-align:right}
    .calendar-wrap{overflow:visible;padding:.45rem}
    .calendar{width:100%;min-width:0;border-collapse:separate;border-spacing:0;table-layout:fixed;border:1px solid #cbd5e1;border-radius:10px;overflow:hidden}
    .calendar th{height:25px;padding:.22rem;background:#eef2f7;border-right:1px solid #cbd5e1;font-size:.75rem}.calendar th:last-child{border-right:0}
    .calendar td{height:90px;vertical-align:top;padding:.25rem;border-right:1px solid #dbe2ea;border-top:1px solid #dbe2ea;background:#fff;overflow:hidden;position:relative}
    .calendar.week-mode td{height:calc(100vh - 300px);min-height:520px}.calendar.week-mode .activities{max-height:calc(100vh - 370px)}
    .calendar td:last-child{border-right:0}.calendar td.outside{color:#94a3b8}.calendar td.lektibo1{background:var(--ebal1-color)}.calendar td.lektibo2{background:var(--ebal2-color)}.calendar td.lektibo3{background:var(--ebal3-color)}.calendar td.jaieguna{background:#fff}.calendar td.jaieguna .day-number{color:#b91c1c}.calendar td.ezlektiboa{background:#000;color:#fff}.calendar td.ordezkatua{background:#ff0}
    .day-head{display:flex;justify-content:space-between;align-items:flex-start;gap:.25rem;margin-bottom:.2rem;min-height:20px}.day-number{font-weight:900;font-size:.78rem}
    .attendance{display:flex;justify-content:flex-end;gap:.25rem;flex-wrap:wrap}
    .attendance a{display:inline-flex;align-items:center;gap:.12rem;padding:.1rem .25rem;border:1px solid #bfdbfe;border-radius:999px;background:#eff6ff;color:#1e40af;text-decoration:none;font-size:.63rem;font-weight:900}
    .attendance a.open{background:#dcfce7;border-color:#86efac;color:#166534}
    .activities{display:grid;gap:.18rem;max-height:66px;overflow-y:auto;scrollbar-width:thin}.activity{padding:.2rem .3rem;border:1px solid #bfdbfe;border-left:4px solid #3b82f6;border-radius:5px;background:#eff6ff;color:#172033;font-size:.66rem;line-height:1.15;cursor:pointer;overflow:hidden}
    .activity[draggable="true"]{cursor:grab}.activity.dragging{opacity:.4}.calendar td.drop-target{outline:2px dashed #2563eb;outline-offset:-3px}
    .activity.common{border-left-color:#7c3aed;background:#f5f3ff}.activity-title{font-weight:850}.activity-meta{display:flex;gap:.35rem;align-items:center;margin-top:.18rem;color:#64748b;font-size:.65rem;flex-wrap:wrap}.activity-badge{font-weight:900;color:#1d4ed8}.activity.common .activity-badge{color:#6d28d9}
    .activity-note{font-size:.72rem}.denb-dialog{width:min(560px,calc(100% - 2rem));border:0;border-radius:14px;padding:0;box-shadow:0 20px 60px rgba(15,23,42,.35)}.denb-dialog::backdrop{background:rgba(15,23,42,.45)}
    .denb-dialog header,.denb-dialog footer{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.8rem 1rem;border-bottom:1px solid #e2e8f0}.denb-dialog footer{justify-content:flex-end;border-top:1px solid #e2e8f0;border-bottom:0}.denb-dialog h2{margin:0;font-size:1.05rem}.denb-dialog-body{display:grid;gap:.65rem;padding:.9rem 1rem}.denb-field{display:grid;gap:.25rem;color:#475569;font-size:.76rem;font-weight:800}.denb-field input,.denb-field textarea{width:100%;padding:.5rem .6rem;border:1px solid #cbd5e1;border-radius:7px;font:inherit}.denb-field textarea{resize:vertical}.denb-field input:disabled,.denb-field textarea:disabled{background:#f1f5f9;color:#64748b}.denb-btn{padding:.45rem .7rem;border:1px solid #94a3b8;border-radius:7px;background:#fff;font:inherit;font-weight:800;cursor:pointer}.denb-btn.primary{background:#172033;color:#fff;border-color:#172033}
    .empty{padding:2rem;text-align:center;color:#64748b}.message{margin:0 0 .8rem;padding:.7rem .85rem;border-radius:8px;font-weight:700}.message.error{background:#fee2e2;color:#991b1b}.egutegi-errorea{padding:2rem;color:#92400e;background:#fffbeb;border:1px solid #fde68a;border-radius:12px}
    .view-tabs{display:flex;gap:.5rem;margin:1rem 0;border-bottom:1px solid #e5e7eb;justify-content:center}.view-tabs a{padding:.35rem .9rem;text-decoration:none;color:#374151;border-radius:.75rem .75rem 0 0;border:1px solid transparent;border-bottom:0;font-size:.9rem}.view-tabs a.active{border-color:#e5e7eb;background:#f9fafb;font-weight:600}
    .calendar-mode-row{margin:-.35rem 0 .75rem;display:flex;justify-content:center}.btn-toggle{display:inline-flex;border:1px solid #d1d5db;border-radius:999px;overflow:hidden;background:#fff}.btn-toggle-option{padding:.38rem .75rem;font-size:.82rem;color:#374151;text-decoration:none;font-weight:600}.btn-toggle-option.selected{background:#111827;color:#fff}.egutegi-oharra{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:6px;border:1px solid #ddd;background:#fff;color:#b91c1c;font-size:.9rem;font-weight:900;cursor:help;user-select:none}.egutegi-oharra:hover{background:#f3f4f6}
    @media(max-width:700px){.denb-header{align-items:stretch;flex-direction:column}.denb-filter{min-width:100%}.month-nav{grid-template-columns:auto 1fr auto}.month-nav a span{display:none}.calendar th{font-size:.62rem}.activity-meta span:nth-child(2){display:none}}
  </style>
</head>
<body>
<div th:replace="~{irakasleak/fragments/ethazi-navbar :: navbar(${ethaziKoadernoAktiboa}, ${irakasleKoadernoAktiboak}, ${irakasleEthaziKoadernoAktiboak})}"></div>

<main class="denb-page">
  <p class="message error" th:if="${error}" th:text="${error}"></p>
  <div class="egutegi-errorea" th:if="${egutegiErrorea}" th:text="${egutegiErrorea}"></div>
  <nav class="view-tabs" aria-label="Denboralizazioaren ikuspegia" th:if="${denboralizazioa != null}">
    <a th:href="@{/irakasle/ethazi-koadernoa/denboralizazioa(bista='egutegia',urtea=${denboralizazioa.urtea},hilabetea=${denboralizazioa.hilabetea},moduloaId=${denboralizazioa.aukeratutakoModuloaId},egutegiMota=${egutegiMota},asteHasiera=${asteHasiera})}"
       th:classappend="${bista == 'egutegia'} ? ' active'">🗓 Egutegi bista</a>
    <a th:href="@{/irakasle/ethazi-koadernoa/denboralizazioa(bista='faltak',urtea=${denboralizazioa.urtea},hilabetea=${denboralizazioa.hilabetea},moduloaId=${denboralizazioa.aukeratutakoModuloaId})}"
       th:classappend="${bista == 'faltak'} ? ' active'">📋 Falten bista</a>
  </nav>
  <section class="denb-card" th:if="${denboralizazioa != null and bista == 'egutegia'}">
    <header class="denb-header">
      <div>
        <h1>Denboralizazioa</h1>
        <div class="muted" th:text="${ethaziKoadernoAktiboa.izena + ' · ' + denboralizazioa.ikasturtea}">Koadernoa</div>
      </div>
      <label class="denb-filter">Modulua
        <select id="moduluIragazkia" onchange="aldatuModuluIragazkia(this.value)">
          <option value="" th:selected="${denboralizazioa.aukeratutakoModuloaId == null}">Nire moduluak</option>
          <option th:each="modulua : ${denboralizazioa.moduluAukerak}"
                  th:value="${modulua.id}" th:text="${modulua.etiketa}"
                  th:selected="${modulua.id == denboralizazioa.aukeratutakoModuloaId}">MOD</option>
        </select>
      </label>
    </header>

    <nav class="month-nav" aria-label="Hilabeteen nabigazioa">
      <a th:href="${egutegiMota == 'astea'} ?
          @{/irakasle/ethazi-koadernoa/denboralizazioa(urtea=${asteHasiera.minusWeeks(1).year},hilabetea=${asteHasiera.minusWeeks(1).monthValue},moduloaId=${denboralizazioa.aukeratutakoModuloaId},bista='egutegia',egutegiMota='astea',asteHasiera=${asteHasiera.minusWeeks(1)})} :
          @{/irakasle/ethazi-koadernoa/denboralizazioa(urtea=${denboralizazioa.hilabetea == 1 ? denboralizazioa.urtea - 1 : denboralizazioa.urtea},hilabetea=${denboralizazioa.hilabetea == 1 ? 12 : denboralizazioa.hilabetea - 1},moduloaId=${denboralizazioa.aukeratutakoModuloaId},bista='egutegia',egutegiMota='hilabetea')}">← <span>Aurrekoa</span></a>
      <h2 th:text="${denboralizazioa.hilabeteEtiketa}">Hilabetea</h2>
      <a th:href="${egutegiMota == 'astea'} ?
          @{/irakasle/ethazi-koadernoa/denboralizazioa(urtea=${asteHasiera.plusWeeks(1).year},hilabetea=${asteHasiera.plusWeeks(1).monthValue},moduloaId=${denboralizazioa.aukeratutakoModuloaId},bista='egutegia',egutegiMota='astea',asteHasiera=${asteHasiera.plusWeeks(1)})} :
          @{/irakasle/ethazi-koadernoa/denboralizazioa(urtea=${denboralizazioa.hilabetea == 12 ? denboralizazioa.urtea + 1 : denboralizazioa.urtea},hilabetea=${denboralizazioa.hilabetea == 12 ? 1 : denboralizazioa.hilabetea + 1},moduloaId=${denboralizazioa.aukeratutakoModuloaId},bista='egutegia',egutegiMota='hilabetea')}"><span>Hurrengoa</span> →</a>
    </nav>
    <div class="calendar-mode-row">
      <div class="btn-toggle">
        <a class="btn-toggle-option" th:classappend="${egutegiMota == 'hilabetea'} ? ' selected'"
           th:href="@{/irakasle/ethazi-koadernoa/denboralizazioa(urtea=${denboralizazioa.urtea},hilabetea=${denboralizazioa.hilabetea},moduloaId=${denboralizazioa.aukeratutakoModuloaId},bista='egutegia',egutegiMota='hilabetea')}">Hilabete bista</a>
        <a class="btn-toggle-option" th:classappend="${egutegiMota == 'astea'} ? ' selected'"
           th:href="@{/irakasle/ethazi-koadernoa/denboralizazioa(urtea=${denboralizazioa.urtea},hilabetea=${denboralizazioa.hilabetea},moduloaId=${denboralizazioa.aukeratutakoModuloaId},bista='egutegia',egutegiMota='astea')}">Asteko bista</a>
      </div>
    </div>

    <div class="calendar-wrap">
      <table class="calendar" th:classappend="${egutegiMota == 'astea'} ? ' week-mode'">
        <thead><tr><th>Astelehena</th><th>Asteartea</th><th>Asteazkena</th><th>Osteguna</th><th>Ostirala</th></tr></thead>
        <tbody>
          <tr th:each="astea : ${ikusgaiAsteak}">
            <td th:each="eguna : ${astea}" th:attr="data-date=${eguna.data}"
                th:classappend="${(!eguna.hilabeteAktibokoa ? ' outside' : '') + (!#strings.isEmpty(eguna.klasea) ? ' ' + eguna.klasea : '')}">
              <div class="day-head">
                <span class="day-number" th:text="${eguna.data.dayOfMonth}">1</span>
                <div class="attendance" th:if="${(eguna.hilabeteAktibokoa or egutegiMota == 'astea') and (!#lists.isEmpty(eguna.asistentziak) or egutegiOharrak[eguna.data.toString()] != null)}">
                  <a th:each="asistentzia : ${eguna.asistentziak}"
                     th:href="@{/irakasle/ethazi-koadernoa/denboralizazioa/asistentzia(data=${eguna.data},moduloaId=${asistentzia.moduloaId},filtroModuloaId=${denboralizazioa.aukeratutakoModuloaId},urtea=${denboralizazioa.urtea},hilabetea=${denboralizazioa.hilabetea},egutegiMota=${egutegiMota},asteHasiera=${asteHasiera})}"
                     th:classappend="${asistentzia.irekita} ? ' open' : ''"
                     th:title="${asistentzia.etiketa + ' — asistentzia'}">
                    <span th:text="${asistentzia.irekita ? '👤✔' : '👤'}">👤</span>
                    <span th:if="${denboralizazioa.aukeratutakoModuloaId == null}" th:text="${asistentzia.etiketa}">MOD</span>
                  </a>
                  <span class="egutegi-oharra" th:if="${egutegiOharrak[eguna.data.toString()] != null}"
                        th:title="${egutegiOharrak[eguna.data.toString()]}">!</span>
                </div>
              </div>
              <div class="activities" th:if="${eguna.hilabeteAktibokoa or egutegiMota == 'astea'}">
                <article class="activity" th:each="jarduera : ${eguna.jarduerak}"
                         th:classappend="${jarduera.orokorra} ? ' common' : ''"
                         th:attr="data-id=${jarduera.id},data-editable=${jarduera.editagarria},data-movable=${jarduera.mugigarria},draggable=${jarduera.mugigarria}"
                         th:title="${jarduera.deskribapena}"
                         onclick="irekiJarduera(this)">
                  <div class="activity-title" th:text="${jarduera.izenburua}">Jarduera</div>
                  <div class="activity-meta">
                    <span class="activity-badge" th:text="${jarduera.badgea}">MOD</span>
                    <span th:text="${jarduera.erronka}">Erronka</span>
                    <span th:text="${jarduera.orduak.stripTrailingZeros().toPlainString() + ' h'}">1 h</span>
                    <span class="activity-note" th:if="${jarduera.oharrak != null}" title="Oharrak">📝</span>
                  </div>
                </article>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
      <p class="empty" th:if="${#lists.isEmpty(denboralizazioa.moduluAukerak)}">Ez duzu talde honetako modulu aktiborik esleituta.</p>
    </div>
  </section>

  <section class="denb-card" th:if="${jarraipena != null and bista == 'faltak'}"
           th:insert="~{irakasleak/ethazi/falten-bista-fragment :: faltakBista}"></section>

  <dialog id="jardueraDialog" class="denb-dialog" th:if="${bista == 'egutegia'}">
    <form id="jardueraForm">
      <header><h2>Jarduera editatu</h2><button type="button" class="denb-btn" onclick="itxiJarduera()">×</button></header>
      <div class="denb-dialog-body">
        <input type="hidden" id="jardueraId">
        <label class="denb-field">Izenburua<input id="jardueraIzenburua" maxlength="200" required></label>
        <label class="denb-field">Deskribapena<textarea id="jardueraDeskribapena" rows="3"></textarea></label>
        <label class="denb-field">Orduak<input id="jardueraOrduak" type="number" min="1" step="1" required></label>
        <label class="denb-field">Oharrak<textarea id="jardueraOharrak" rows="4" placeholder="Jarduerari buruzko oharrak..."></textarea></label>
        <small id="jardueraLaguntza" class="muted"></small>
      </div>
      <footer><button type="button" class="denb-btn" onclick="itxiJarduera()">Ezeztatu</button><button type="submit" class="denb-btn primary">Gorde</button></footer>
    </form>
  </dialog>
</main>
<script th:if="${bista == 'egutegia'}" th:inline="javascript">
  function aldatuModuluIragazkia(moduloaId) {
    const url = new URL(window.location.href);
    if (moduloaId) url.searchParams.set('moduloaId', moduloaId);
    else url.searchParams.delete('moduloaId');
    window.location.href = url.toString();
  }

  const csrf = document.querySelector('meta[name="_csrf"]')?.content;
  const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.content || 'X-CSRF-TOKEN';
  const dialog = document.getElementById('jardueraDialog');
  let arrastatutakoJarduera = null;
  let arrastatzen = false;

  async function irekiJarduera(elementua) {
    if (arrastatzen || elementua.dataset.editable !== 'true') return;
    const response = await fetch(`/irakasle/ethazi-koadernoa/denboralizazioa/jarduerak/${elementua.dataset.id}`);
    const data = await response.json();
    if (!response.ok) { alert(data.error || 'Ezin izan da jarduera kargatu.'); return; }
    document.getElementById('jardueraId').value = data.id;
    document.getElementById('jardueraIzenburua').value = data.izenburua || '';
    document.getElementById('jardueraDeskribapena').value = data.deskribapena || '';
    document.getElementById('jardueraOrduak').value = data.orduak || '';
    document.getElementById('jardueraOharrak').value = data.oharrak || '';
    ['jardueraIzenburua','jardueraDeskribapena','jardueraOrduak'].forEach(id => {
      document.getElementById(id).disabled = !data.edukiEditagarria;
    });
    document.getElementById('jardueraLaguntza').textContent = data.edukiEditagarria
      ? 'Jardueraren edukia eta oharrak editatu ditzakezu.'
      : 'Jarduera orokorra da: oharrak bakarrik edita daitezke.';
    dialog.showModal();
  }

  function itxiJarduera() { dialog.close(); }

  document.getElementById('jardueraForm').addEventListener('submit', async event => {
    event.preventDefault();
    const id = document.getElementById('jardueraId').value;
    const params = new URLSearchParams({
      izenburua: document.getElementById('jardueraIzenburua').value,
      deskribapena: document.getElementById('jardueraDeskribapena').value,
      orduak: document.getElementById('jardueraOrduak').value,
      oharrak: document.getElementById('jardueraOharrak').value
    });
    const response = await fetch(`/irakasle/ethazi-koadernoa/denboralizazioa/jarduerak/${id}`, {
      method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8', [csrfHeader]:csrf}, body:params
    });
    const data = await response.json();
    if (!response.ok) { alert(data.error || 'Ezin izan da jarduera gorde.'); return; }
    window.location.reload();
  });

  document.querySelectorAll('.activity[data-movable="true"]').forEach(activity => {
    activity.addEventListener('dragstart', event => {
      arrastatutakoJarduera = activity;
      arrastatzen = true;
      activity.classList.add('dragging');
      event.dataTransfer.effectAllowed = 'move';
      event.dataTransfer.setData('text/plain', activity.dataset.id);
    });
    activity.addEventListener('dragend', () => {
      activity.classList.remove('dragging');
      document.querySelectorAll('.drop-target').forEach(td => td.classList.remove('drop-target'));
      arrastatutakoJarduera = null;
      setTimeout(() => { arrastatzen = false; }, 0);
    });
  });

  document.querySelectorAll('.calendar td[data-date]').forEach(day => {
    day.addEventListener('dragover', event => {
      if (!arrastatutakoJarduera) return;
      event.preventDefault();
      event.dataTransfer.dropEffect = 'move';
      day.classList.add('drop-target');
    });
    day.addEventListener('dragleave', () => day.classList.remove('drop-target'));
    day.addEventListener('drop', async event => {
      event.preventDefault();
      day.classList.remove('drop-target');
      if (!arrastatutakoJarduera) return;
      const id = arrastatutakoJarduera.dataset.id;
      const params = new URLSearchParams({data:day.dataset.date});
      const response = await fetch(`/irakasle/ethazi-koadernoa/denboralizazioa/jarduerak/${id}/mugitu`, {
        method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8', [csrfHeader]:csrf}, body:params
      });
      const data = await response.json();
      if (!response.ok) { alert(data.error || 'Ezin izan da jarduera mugitu.'); return; }
      window.location.reload();
    });
  });
</script>
</body>
</html>
