<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="eu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ethazi koadernoa — Egutegia</title>
  <link rel="stylesheet" th:href="@{/css/irakasle-navbar.css}">
  <link rel="stylesheet" th:href="@{/css/irakasle-common.css}">
  <link rel="stylesheet" th:href="@{/css/ethazi-koadernoa.css}">
  <style>
    .egutegi-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:1.5rem; align-items:flex-start; }
    .hilabete-card { background:var(--bg-card); border-radius:.75rem; border:1px solid var(--b); box-shadow:0 1px 3px rgba(15,23,42,.08); padding:.75rem .75rem 1rem; }
    .hilabete-card h3 { margin:0 0 .5rem; font-size:.95rem; text-align:center; text-transform:capitalize; }
    .hilabete-card table { width:100%; border-collapse:collapse; font-size:.75rem; }
    .hilabete-card thead th { background:#f3f4f6; font-weight:600; }
    .hilabete-card th,.hilabete-card td { border:1px solid #d1d5db; padding:3px; text-align:center; width:26px; height:26px; }
    .hilabete-card tbody tr:nth-child(even) { background:transparent; }
    .hilabete-card td { font-size:.7rem; }
    .blank { background:#f3f4f6; } .lektibo1 { background:var(--ebal1-color); }
    .lektibo2 { background:var(--ebal2-color); } .lektibo3 { background:var(--ebal3-color); }
    .jaieguna { background:#fff; color:#b91c1c; font-weight:600; }
    .ezlektiboa { background:#111827; color:#fff; } .ordezkatua { background:#fef3c7; }
    .oharra-eguna { position:relative; cursor:help; }
    .oharra-eguna::after { content:""; position:absolute; right:2px; bottom:2px; width:6px; height:6px; border-radius:999px; background:#111827; opacity:.65; }
    .egutegi-legend { display:flex; align-items:center; justify-content:center; gap:.75rem; margin:0 0 1rem; font-size:.85rem; color:#374151; flex-wrap:wrap; }
    .legend-item { display:inline-flex; align-items:center; gap:.35rem; }
    .legend-swatch { width:1rem; height:1rem; border:1px solid #9ca3af; border-radius:.25rem; display:inline-block; }
    .egutegi-errorea { padding:2rem; color:#92400e; background:#fffbeb; border:1px solid #fde68a; border-radius:12px; }
    @media(max-width:1024px){.egutegi-grid{grid-template-columns:repeat(2,minmax(0,1fr));}}
    @media(max-width:700px){.egutegi-grid{grid-template-columns:1fr;}}
  </style>
</head>
<body>
<div th:replace="~{irakasleak/fragments/ethazi-navbar :: navbar(${ethaziKoadernoAktiboa}, ${irakasleKoadernoAktiboak}, ${irakasleEthaziKoadernoAktiboak})}"></div>

<main class="page">
  <h1 th:text="${ethaziKoadernoAktiboa.izena + ' — Egutegia'}">Ethazi koadernoa — Egutegia</h1>
  <div class="egutegi-errorea" th:if="${egutegiErrorea}" th:text="${egutegiErrorea}"></div>
  <th:block th:if="${egutegia != null}">
    <h2 th:text="${ikasturtea.izena}">Ikasturtea</h2>
    <div class="egutegi-legend" aria-label="Ebaluazioen koloreak">
      <span class="legend-item"><span class="legend-swatch lektibo1"></span>1. ebaluazioa</span>
      <span class="legend-item"><span class="legend-swatch lektibo2"></span>2. ebaluazioa</span>
      <span class="legend-item"><span class="legend-swatch lektibo3"></span>3. ebaluazioa</span>
    </div>
    <div class="egutegi-grid">
      <section th:each="entry : ${hilabeteka}" class="hilabete-card">
        <h3 th:text="${entry.key}">Hilabetea</h3>
        <table>
          <thead><tr><th>Al</th><th>Ar</th><th>Az</th><th>Og</th><th>Or</th><th>Lr</th><th>Ig</th></tr></thead>
          <tbody><tr th:each="astea : ${entry.value}">
            <td th:each="egun : ${astea}"
                th:class="${egun == null ? 'blank' : ((klaseMap[egun.toString()] != null ? klaseMap[egun.toString()] : '') + (oharraMap[egun.toString()] != null ? ' oharra-eguna' : ''))}"
                th:title="${egun != null ? (deskribapenaMap[egun.toString()] != null ? deskribapenaMap[egun.toString()] : '') : ''}"
                th:text="${egun != null ? egun.dayOfMonth : ''}"></td>
          </tr></tbody>
        </table>
      </section>
    </div>
  </th:block>
</main>
</body>
</html>
