<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Zikloa gorde</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/kudeatzaile-common.css}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
	<div th:replace="kudeatzaile/fragments/navbar :: kudeatzaile-navbar"></div>
	<main class="page">
	    <h1 th:text="${zikloa.id} != null ? 'Zikloa editatu' : 'Ziklo berria sortu'"></h1>

	    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
	    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
	
	    <form class="form" th:action="@{/kudeatzaile/zikloak/gorde}" th:object="${zikloa}" method="post">
	        <!-- ID ezkutuan, bakarrik editatzeko -->
	        <input type="hidden" th:if="${zikloa.id != null}" th:field="*{id}" />
			
			<div class="field">
		        <label for="izena">Izena:</label>
		        <input type="text" id="izena" th:field="*{izena}" required />
	    	</div>
	
			<div class="field">
		        <label for="maila">Maila:</label>
		        <select id="maila" th:field="*{maila}" required>
		            <option th:each="m : ${mailak}" th:value="${m}" th:text="${m}"></option>
		        </select>
		    </div>
	
			<div class="field">
		        <label for="familia">Familia:</label>
		        <!-- GAKOA: familia.id bideratu -->
		        <select id="familia" th:field="*{familia.id}" required>
		            <option value="" th:if="${zikloa.familia == null}" selected>— Aukeratu —</option>
		            <option th:each="f : ${familiak}"
		                    th:value="${f.id}"
		                    th:text="${f.izena}">
		            </option>
		        </select>
			</div>
			
			<div class="form-actions">
	        	<button class="btn btn-primary" type="submit">Gorde</button>
	        	<a class="btn btn-secondary" th:href="@{/kudeatzaile/zikloak}">Atzera</a>
	        </div>
	    </form>

	    <section class="section" th:if="${zikloa.id != null}">
	        <h2>ETHAZI</h2>
	        <p class="muted">Ezarri ziklo honetako gaitasun moten pisu orokorrak. Bi pisuen baturak %100 izan behar du.</p>
	        <form class="form" th:action="@{/kudeatzaile/zikloak/{id}/ethazi-pisuak(id=${zikloa.id})}" method="post">
	            <div class="field">
	                <label for="teknikoenPisua">Gaitasun teknikoen pisua (%), defektuz:</label>
	                <input type="number" id="teknikoenPisua" name="teknikoenPisua"
	                       min="0" max="100" step="0.01" required
	                       th:value="${teknikoenPisua != null ? teknikoenPisua : (zikloa.ethaziTeknikoenPisua != null ? zikloa.ethaziTeknikoenPisua : 70)}">
	            </div>
	            <div class="field">
	                <label for="zeharkakoenPisua">Zeharkako gaitasunen pisua (%), defektuz:</label>
	                <input type="number" id="zeharkakoenPisua" name="zeharkakoenPisua"
	                       min="0" max="100" step="0.01" required
	                       th:value="${zeharkakoenPisua != null ? zeharkakoenPisua : (zikloa.ethaziZeharkakoenPisua != null ? zikloa.ethaziZeharkakoenPisua : 30)}">
	            </div>
	            <div class="form-actions">
	                <button class="btn btn-primary" type="submit">ETHAZI pisuak gorde</button>
	            </div>
	        </form>
	    </section>
	</main>
	<script th:src="@{/js/kudeatzaile-nav.js}"></script>
</body>
</html>
