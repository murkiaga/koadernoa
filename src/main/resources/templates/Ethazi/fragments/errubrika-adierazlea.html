<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="eu"><body>
<div th:fragment="editor(g, m, a)"
     th:with="failed=${failedForm != null and failedGaitasunaId == g.id and failedMailaId == m.id and (a == null ? failedAdierazleaId == null : failedAdierazleaId == a.id)}, key=${'inline-' + g.id + '-' + m.id + '-' + (a == null ? 'new' : a.id)}">
    <form data-dirty-warning class="indicator-form" method="post"
          th:action="${a == null} ? @{/ethazi/errubrika/gaitasunak/{id}/mailak/{mid}/adierazleak/berria(id=${g.id},mid=${m.id})} : @{/ethazi/errubrika/gaitasunak/{id}/mailak/{mid}/adierazleak/{aid}/editatu(id=${g.id},mid=${m.id},aid=${a.id})}"><input type="hidden" name="hizkuntza" th:value="${hizkuntza}">
        <div class="field">
            <label th:for="${key + '-description'}">Lorpen-adierazlearen deskribapena</label>
            <div class="translation-editor"><label>Testuaren hizkuntza <select data-translation-select><option value="Eu">Euskara</option><option value="Es">Gaztelera</option><option value="En">Ingelera</option></select></label><div data-translation-panel="Eu"><span class="muted">Euskara</span><textarea aria-label="Euskara" name="deskribapena" th:id="${key + '-description'}" rows="4" maxlength="60000"
                      th:text="${failed ? failedForm.deskribapena : (a == null ? '' : a.deskribapena)}" ></textarea></div><div data-translation-panel="Es"><span class="muted">Gaztelera</span><textarea aria-label="Gaztelera" name="deskribapenaEs" rows="4" maxlength="60000"
                      th:text="${failed ? failedForm.deskribapenaEs : (a == null ? '' : a.deskribapenaEs)}" ></textarea></div><div data-translation-panel="En"><span class="muted">Ingelera</span><textarea aria-label="Ingelera" name="deskribapenaEn" rows="4" maxlength="60000"
                      th:text="${failed ? failedForm.deskribapenaEn : (a == null ? '' : a.deskribapenaEn)}" ></textarea></div></div>
        </div>
        <details th:replace="~{Ethazi/fragments/adierazlea :: picker(${a}, ${failed})}"></details>
        <button class="btn btn-primary" th:text="${a == null ? 'Gehitu' : 'Gorde'}"></button>
    </form>
</div>
</body></html>
