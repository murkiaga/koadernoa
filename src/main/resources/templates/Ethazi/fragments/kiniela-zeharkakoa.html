<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><body>
<section th:fragment="taula(m, zikloaId)" class="ethazi-card kiniela-module kiniela-transverse-board" th:attr="data-module=${m.id},data-language=${m.hizkuntzaKodea}">
<div class="table-wrap"><table class="kiniela-table"><thead><tr><th rowspan="2">Zeharkako gaitasuna</th><th rowspan="2">Kalifikazioa</th><th rowspan="2">Guztira</th><th th:colspan="${#lists.isEmpty(m.erronkak) ? 1 : #lists.size(m.erronkak)}">Erronkak</th></tr><tr><th class="challenge-heading" th:each="e : ${m.erronkak}"><span class="muted" th:text="${e.maila}"></span><br><span th:text="${e.izena}"></span></th><th th:if="${#lists.isEmpty(m.erronkak)}" class="muted">Ez dago erronkarik</th></tr></thead>
<tbody><th:block th:each="ie, state : ${m.emaitzak}"><tr class="kiniela-ie" th:attr="data-outcome=${ie.id}" th:id="'ie-' + ${m.id} + '-' + ${ie.id}"><th><button type="button" class="ie-select" th:attr="data-ie-id=${ie.id}" th:text="${ie.kodea + '. ' + ie.deskribapena}"></button></th><td class="ie-total" th:text="${ie.guztira + '%'}"></td><td class="module-total" rowspan="0" th:if="${state.first}" th:text="${m.guztira + '%'}"></td><td th:colspan="${#lists.isEmpty(m.erronkak) ? 1 : #lists.size(m.erronkak)}"></td></tr>
<tr class="kiniela-link" th:each="a : ${ie.loturak}" th:attr="data-module=${m.id},data-indicator=${a.id},data-outcome=${ie.id},data-note=${a.oharra}" th:classappend="${!#sets.isEmpty(a.erronkaIds)} ? 'is-covered'"><td class="indicator-cell"><span class="indicator-text"><span th:text="${a.kodea}"></span> <span th:text="${a.deskribapena}"></span></span> <button type="button" class="indicator-note" th:attr="aria-label=${'Oharra: ' + a.kodea}" th:text="${#strings.isEmpty(a.oharra) ? 'Oharra' : '📝 Oharra'}"></button></td><td><form class="weight-form" method="post" th:action="@{/ethazi/kiniela/zeharkakoak/{id}/pisua(id=${ie.id})}"><input type="hidden" name="zikloaId" th:value="${zikloaId}"><input type="hidden" name="adierazleaId" th:value="${a.id}"><div class="weight-controls"><input type="number" name="pisua" min="0" max="100" step="0.01" required th:value="${a.pisua}" th:attr="aria-label=${'Pisua: ' + a.kodea}"><span>%</span></div><span class="save-status" role="status"></span></form></td><td class="challenge-cell" th:each="e : ${m.erronkak}"><form class="challenge-form" method="post" th:action="@{/ethazi/kiniela/zeharkakoak/{gid}/adierazleak/{id}/erronka(gid=${ie.id},id=${a.id})}" th:attr="data-sync-key=${e.sinkronizazioGakoa}"><input type="hidden" name="zikloaId" th:value="${zikloaId}"><input type="hidden" name="ieId" th:value="${ie.id}"><input type="hidden" name="erronkaId" th:value="${e.id}"><input type="checkbox" name="landuta" value="true" th:checked="${a.erronkaIds.contains(e.id)}" th:attr="aria-label=${a.kodea + ' · ' + e.izena}"><span class="save-status" role="status"></span></form></td><td th:if="${#lists.isEmpty(m.erronkak)}"></td></tr>
<tr th:if="${#lists.isEmpty(ie.loturak)}"><td colspan="2" class="muted">Oraindik ez dago lotutako lorpen-adierazlerik.</td><td th:colspan="${#lists.isEmpty(m.erronkak) ? 1 : #lists.size(m.erronkak)}"></td></tr></th:block></tbody></table></div><p th:if="${#lists.isEmpty(m.emaitzak)}" class="empty-state">Ez dago zeharkako gaitasunik.</p>
</section></body></html>
