<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" lang="eu">
<head th:replace="~{Ethazi/fragments/common :: head('Ebaluazio laburpena')}"></head><body class="ethazi-body">
<div th:replace="~{kudeatzaile/fragments/navbar :: kudeatzaile-navbar}"></div>
<nav th:replace="~{Ethazi/fragments/navbar :: navbar('erronkak')}"></nav>
<main class="page ethazi-page evaluation-summary-page">
  <header class="page-header"><div><h1>Ebaluazio laburpena</h1><p><strong th:text="${laburpena.erronka.izena}"></strong></p></div>
    <a class="btn" th:href="@{/ethazi/erronkak(zikloaId=${itzuliZikloaId},mailaId=${itzuliMailaId},hizkuntza=${itzuliHizkuntza},ikasturteaId=${itzuliIkasturteaId})}">← Erronketara</a>
  </header>
  <p th:if="${#lists.isEmpty(laburpena.ikasleak)}" class="empty-state">Erronkak ez du ikaslerik esleituta.</p>
  <div th:unless="${#lists.isEmpty(laburpena.ikasleak)}" class="evaluation-summary-scroll" tabindex="0" role="region" aria-label="Ebaluazio laburpenaren taula">
    <table class="evaluation-summary-table"><thead>
      <tr><th rowspan="2" class="summary-student">Ikaslea</th>
        <th th:each="eb : ${laburpena.ebidentziak}" th:colspan="${eb.ebaluazioAnitza ? 4 : 1}" class="summary-evidence-group"><span th:text="${eb.izena}"></span><small class="summary-header-weight" th:text="${eb.pisuaEtiketa}"></small></th>
        <th rowspan="2" class="summary-transverse-total"><span>Zeharkakoa</span><small class="summary-header-weight" th:text="${laburpena.zeharkakoenPisuaEtiketa}"></small></th>
        <th th:colspan="${#lists.size(laburpena.moduluak)}" class="summary-technical-group"><span>Teknikoak</span> <span th:text="${'(' + laburpena.teknikoenPisuaEtiketa + ')'}"></span></th>
        <th rowspan="2" class="summary-spacer" aria-label=""></th>
        <th th:each="m : ${laburpena.moduluak}" rowspan="2" th:title="${m.izena}" th:text="${m.kodea + ' TOTALA'}"></th>
      </tr><tr>
        <th:block th:each="eb : ${laburpena.ebidentziak}">
          <th th:if="${eb.ebaluazioAnitza}" class="summary-evidence-column">Irakasle</th><th th:if="${eb.ebaluazioAnitza}" class="summary-evidence-column">Koeb.</th><th th:if="${eb.ebaluazioAnitza}" class="summary-evidence-column">Autoeb.</th>
          <th class="summary-evidence-column">Zehar ebidentzia</th>
        </th:block>
        <th th:each="m : ${laburpena.moduluak}" th:title="${m.izena}" th:text="${m.kodea}"></th>
      </tr></thead><tbody>
      <tr th:each="ikaslea : ${laburpena.ikasleak}"><th class="summary-student" th:text="${ikaslea.izena}"></th>
        <th:block th:each="nota, ns : ${ikaslea.zeharkakoNotak}">
          <td th:if="${laburpena.ebidentziak[ns.index].ebaluazioAnitza}" class="summary-evidence-column" th:text="${nota.irakaslea != null ? #numbers.formatDecimal(nota.irakaslea,1,2) : '—'}"></td>
          <td th:if="${laburpena.ebidentziak[ns.index].ebaluazioAnitza}" class="summary-evidence-column" th:text="${nota.koebaluazioa != null ? #numbers.formatDecimal(nota.koebaluazioa,1,2) : '—'}"></td>
          <td th:if="${laburpena.ebidentziak[ns.index].ebaluazioAnitza}" class="summary-evidence-column" th:text="${nota.autoebaluazioa != null ? #numbers.formatDecimal(nota.autoebaluazioa,1,2) : '—'}"></td>
          <td class="summary-evidence-column summary-evidence-total" th:classappend="${nota.minimoaUrratuta} ? ' minimum-failed'" th:text="${nota.guztira != null ? #numbers.formatDecimal(nota.guztira,1,2) : '—'}"></td>
        </th:block>
        <td class="summary-transverse-total" th:classappend="${ikaslea.zeharkakoMinimoaUrratuta} ? ' minimum-failed'">
          <button type="button" class="technical-calculation-open" th:classappend="${ikaslea.zeharkakoMinimoaUrratuta} ? ' minimum-failed'"
            th:attr="data-calculation-id=${'transverse-calculation-' + ikaslea.id},aria-label=${ikaslea.izena + ', Zeharkakoa: nola kalkulatu da?'}"
            th:text="${ikaslea.zeharkakoa != null ? #numbers.formatDecimal(ikaslea.zeharkakoa,1,2) : '—'}"></button>
          <template th:id="${'transverse-calculation-' + ikaslea.id}">
            <article class="technical-calculation-detail"><p class="technical-calculation-context"><strong th:text="${ikaslea.izena}"></strong><span> · Zeharkakoa</span></p>
              <section class="calculation-section"><h3>1. Zeharkako ebidentziak</h3>
                <div class="transverse-calculation-evidence" th:each="nota, ns : ${ikaslea.zeharkakoNotak}">
                  <h4><span th:text="${laburpena.ebidentziak[ns.index].izena}"></span> <small th:text="${'(' + laburpena.ebidentziak[ns.index].pisuaEtiketa + ')'}"></small></h4>
                  <p><strong th:text="${nota.irakasleKopurua + ' irakaslek ebaluatu dute.'}"></strong></p>
                  <dl class="calculation-values"><div><dt>Irakasleen batezbestekoa</dt><dd th:text="${nota.irakaslea != null ? #numbers.formatDecimal(nota.irakaslea,1,2) : (nota.guztira != null ? #numbers.formatDecimal(nota.guztira,1,2) : '—')}"></dd></div><div th:if="${laburpena.ebidentziak[ns.index].ebaluazioAnitza}"><dt>Koebaluazioa</dt><dd th:text="${nota.koebaluazioa != null ? #numbers.formatDecimal(nota.koebaluazioa,1,2) : 'Kalifikaziorik ez'}"></dd></div><div th:if="${laburpena.ebidentziak[ns.index].ebaluazioAnitza}"><dt>Autoebaluazioa</dt><dd th:text="${nota.autoebaluazioa != null ? #numbers.formatDecimal(nota.autoebaluazioa,1,2) : 'Kalifikaziorik ez'}"></dd></div><div th:if="${nota.minimoa != null}"><dt>Minimoa</dt><dd th:text="${nota.minimoa}"></dd></div></dl>
                  <p th:if="${laburpena.ebidentziak[ns.index].ebaluazioAnitza and nota.irakasleenEragiketa != null}" class="calculation-formula"><span>Irakasleen batezbestekoa</span><strong th:text="${nota.irakasleenEragiketa}"></strong></p>
                  <p th:if="${nota.eragiketa != null}" class="calculation-formula"><span th:text="${nota.eragiketa}"></span><strong th:text="${'Ebidentziaren nota: ' + #numbers.formatDecimal(nota.guztira,1,2)}"></strong></p>
                  <p th:if="${nota.minimoaUrratuta}" class="calculation-notice">Ebidentziak ez du ezarritako minimoa gainditu.</p>
                </div>
              </section>
              <section class="calculation-section calculation-final"><h3>2. Zeharkako kalifikazioa</h3>
                <p th:if="${ikaslea.kalkuluZeharkakoa.errubrikaMinimoa != null}" th:text="${'Zeharkako errubrikaren gutxieneko nota: ' + #numbers.formatDecimal(ikaslea.kalkuluZeharkakoa.errubrikaMinimoa,1,2)}"></p>
                <p th:if="${ikaslea.kalkuluZeharkakoa.eragiketa != null}" class="calculation-formula"><span th:text="${ikaslea.kalkuluZeharkakoa.eragiketa}"></span><strong th:text="${'Azken zeharkako kalifikazioa: ' + #numbers.formatDecimal(ikaslea.kalkuluZeharkakoa.guztira,1,2)}"></strong></p>
                <p th:unless="${ikaslea.kalkuluZeharkakoa.eragiketa != null}" class="calculation-notice">Ez dago zeharkako kalifikazioa kalkulatzeko behar adina nota.</p>
                <div th:unless="${#lists.isEmpty(ikaslea.kalkuluZeharkakoa.minimoUrraketak)}" class="calculation-minimum-failure"><strong>Ez da minimora iritsi:</strong><ul><li th:each="urraketa : ${ikaslea.kalkuluZeharkakoa.minimoUrraketak}" th:text="${urraketa}"></li></ul><p th:text="${'Kalkulatutako ' + #numbers.formatDecimal(ikaslea.kalkuluZeharkakoa.kalkulatutakoNota,1,2) + ' nota gehienez 4,00ra mugatu da.'}"></p></div>
              </section>
            </article>
          </template>
        </td>
        <td th:each="kalkulua, ms : ${ikaslea.kalkuluTeknikoak}" class="summary-technical-value" th:classappend="${!#lists.isEmpty(kalkulua.minimoUrraketak)} ? ' minimum-failed'">
          <button type="button" class="technical-calculation-open"
            th:classappend="${!#lists.isEmpty(kalkulua.minimoUrraketak)} ? ' minimum-failed'"
            th:attr="data-calculation-id=${'technical-calculation-' + ikaslea.id + '-' + ms.index},aria-label=${ikaslea.izena + ', ' + laburpena.moduluak[ms.index].kodea + ': nola kalkulatu da?'}"
            th:text="${kalkulua.guztira != null ? #numbers.formatDecimal(kalkulua.guztira,1,2) : '—'}"></button>
          <template th:id="${'technical-calculation-' + ikaslea.id + '-' + ms.index}">
            <article class="technical-calculation-detail">
              <p class="technical-calculation-context"><strong th:text="${ikaslea.izena}"></strong><span> · </span><strong th:text="${laburpena.moduluak[ms.index].kodea}"></strong><span th:text="${' — ' + laburpena.moduluak[ms.index].izena}"></span></p>
              <div th:unless="${kalkulua.konfiguratuta}" class="calculation-notice">Modulu honek ez du errubrika teknikorik konfiguratuta.</div>
              <th:block th:if="${kalkulua.konfiguratuta}">
                <section class="calculation-section"><h3>1. Errubrika teknikoa <span th:text="${kalkulua.errubrikaPisua != null ? '(%' + #numbers.formatDecimal(kalkulua.errubrikaPisua,1,2) + ')' : '(%0)'}"></span></h3>
                  <table class="calculation-components"><thead><tr><th>Ebidentzia</th><th>Pisua</th><th>Minimoa</th><th>Kalifikazioa</th><th>Erabilera</th></tr></thead><tbody>
                    <tr th:each="osagaia : ${kalkulua.ebidentziak}"><td th:text="${osagaia.izena}"></td><td th:text="${'%' + #numbers.formatDecimal(osagaia.pisua,1,2)}"></td><td th:text="${osagaia.minimoa != null ? osagaia.minimoa : '—'}"></td><td th:text="${osagaia.nota != null ? #numbers.formatDecimal(osagaia.nota,1,2) : '—'}"></td><td th:text="${osagaia.nota != null ? 'Kontuan hartuta' : (osagaia.pisua != null and osagaia.pisua.signum() > 0 ? 'Falta da' : 'Pisurik gabe')}"></td></tr>
                  </tbody></table>
                  <p th:if="${kalkulua.errubrikaOsatua}" class="calculation-formula"><span th:text="${kalkulua.errubrikaEragiketa}"></span><strong th:text="${'Errubrikaren nota: ' + #numbers.formatDecimal(kalkulua.errubrikaNota,1,2)}"></strong></p>
                  <p th:unless="${kalkulua.errubrikaOsatua}" class="calculation-notice">Pisua duen ebidentzia bat gutxienez kalifikatu gabe dago; horregatik errubrikaren blokea ez da azken kalkuluan erabili.</p>
                </section>
                <section class="calculation-section"><h3>2. Bestelako probak <span th:text="${kalkulua.probakPisua != null ? '(%' + #numbers.formatDecimal(kalkulua.probakPisua,1,2) + ')' : '(%0)'}"></span></h3>
                  <p th:if="${#lists.isEmpty(kalkulua.probak)}" class="calculation-notice">Ez dago bestelako probarik konfiguratuta.</p>
                  <table th:unless="${#lists.isEmpty(kalkulua.probak)}" class="calculation-components"><thead><tr><th>Proba</th><th>Pisua</th><th>Minimoa</th><th>Kalifikazioa</th><th>Erabilera</th></tr></thead><tbody>
                    <tr th:each="osagaia : ${kalkulua.probak}"><td th:text="${osagaia.izena}"></td><td th:text="${'%' + #numbers.formatDecimal(osagaia.pisua,1,2)}"></td><td th:text="${osagaia.minimoa != null ? osagaia.minimoa : '—'}"></td><td th:text="${osagaia.nota != null ? #numbers.formatDecimal(osagaia.nota,1,2) : '—'}"></td><td th:text="${osagaia.nota != null ? 'Kontuan hartuta' : 'Baztertuta: notarik ez'}"></td></tr>
                  </tbody></table>
                  <p th:unless="${kalkulua.badagoProbaNotarik}" class="calculation-notice">Ikasleak ez du bestelako probetan kalifikaziorik; proben blokea ez da azken kalkuluan kontuan hartu.</p>
                  <p th:if="${kalkulua.probaNotarenBatFaltaDa}" class="calculation-notice">Notarik gabeko probak baztertu dira, eta nota duten proben pisuak %100 bezala normalizatu dira.</p>
                  <p th:if="${kalkulua.probenEragiketa != null}" class="calculation-formula"><span th:text="${kalkulua.probenEragiketa}"></span><strong th:text="${'Bestelako proben nota: ' + #numbers.formatDecimal(kalkulua.probakNota,1,2)}"></strong></p>
                </section>
                <section class="calculation-section calculation-final"><h3>3. Kalifikazio teknikoa</h3>
                  <p th:if="${kalkulua.guztizkoEragiketa != null}" class="calculation-formula"><span th:text="${kalkulua.guztizkoEragiketa}"></span><strong th:text="${'Azken kalifikazio teknikoa: ' + #numbers.formatDecimal(kalkulua.guztira,1,2)}"></strong></p>
                  <p th:unless="${kalkulua.guztizkoEragiketa != null}" class="calculation-notice">Ez dago azken kalifikazioa kalkulatzeko osagai kalifikaturik.</p>
                  <p th:if="${kalkulua.errubrikaNota != null and kalkulua.probakNota == null}">Errubrika teknikoa bakarrik dago kalifikatuta; beraz, haren nota %100ean erabili da.</p>
                  <p th:if="${kalkulua.errubrikaNota == null and kalkulua.probakNota != null}">Bestelako probak bakarrik daude erabilgarri; beraz, haien nota %100ean erabili da.</p>
                  <div th:unless="${#lists.isEmpty(kalkulua.minimoUrraketak)}" class="calculation-minimum-failure"><strong>Ez da minimora iritsi:</strong><ul><li th:each="urraketa : ${kalkulua.minimoUrraketak}" th:text="${urraketa}"></li></ul><p th:text="${'Kalkulatutako ' + #numbers.formatDecimal(kalkulua.kalkulatutakoNota,1,2) + ' nota gehienez 4,00ra mugatu da.'}"></p></div>
                </section>
              </th:block>
            </article>
          </template>
        </td>
        <td class="summary-spacer" aria-hidden="true"></td>
        <td th:each="nota, ms : ${ikaslea.totalak}" class="summary-grand-total"
          th:classappend="${ikaslea.zeharkakoMinimoaUrratuta or !#lists.isEmpty(ikaslea.kalkuluTeknikoak[ms.index].minimoUrraketak)} ? ' minimum-failed'"
          th:text="${nota != null ? #numbers.formatDecimal(nota,1,2) : '—'}"></td>
      </tr>
    </tbody></table>
  </div>
  <dialog id="technical-calculation-dialog" aria-labelledby="technical-calculation-title">
    <header><h2 id="technical-calculation-title">Nola kalkulatu da?</h2><button type="button" class="btn" id="technical-calculation-close" aria-label="Itxi">×</button></header>
    <div id="technical-calculation-content"></div>
  </dialog>
</main><script th:src="@{/js/ethazi.js}" defer></script></body></html>
