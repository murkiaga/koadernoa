<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" lang="eu">
<head th:replace="~{Ethazi/fragments/common :: head('Erronkak')}"></head><body class="ethazi-body">
<div th:replace="~{kudeatzaile/fragments/navbar :: kudeatzaile-navbar}"></div>
<nav th:replace="~{Ethazi/fragments/navbar :: navbar('erronkak')}"></nav>
<main class="page ethazi-page"><div th:replace="~{Ethazi/fragments/common :: messages}"></div>
<header class="page-header"><div><h1>Erronkak</h1><p class="muted">Sortu erronka bana hizkuntza-talde bakoitzeko.</p></div><a class="btn btn-primary" th:href="@{/ethazi/erronkak/berria(zikloaId=${zikloaId})}">+ Erronka</a></header><form class="ethazi-card ethazi-filters" method="get"><div class="field"><label for="zikloaId">Zikloa</label><select id="zikloaId" name="zikloaId" required><option value="">— Aukeratu zikloa —</option><option th:each="z : ${zikloak}" th:value="${z.id}" th:text="${z.izena}" th:selected="${z.id == zikloaId}"></option></select></div><button class="btn btn-primary">Erakutsi</button></form>
<p th:if="${#lists.isEmpty(erronkak)}" class="empty-state">Ez dago erronkarik. Aukeratu zikloa edo sortu erronka bat.</p>
<article class="ethazi-card" th:each="e : ${erronkak}"><header class="page-header"><h2 th:text="${e.izena}"></h2><div class="form-actions"><a class="btn" th:href="@{/ethazi/erronkak/{id}/editatu(id=${e.id})}">Editatu</a><form method="post" th:action="@{/ethazi/erronkak/{id}/ezabatu(id=${e.id})}" data-confirm="Erronka ezabatu?"><button class="btn btn-danger">Ezabatu</button></form></div></header>
<p><span th:text="${e.maila.izena}"></span> · <span th:text="${e.hizkuntza.etiketa}"></span> · <time th:text="${e.hasieraData}"></time> — <time th:text="${e.bukaeraData}"></time></p><p class="preserve" th:text="${e.deskribapena}"></p><ul><li th:each="m : ${e.moduluak}" th:text="${m.kodea + ' · ' + m.izena + ' (' + m.taldea.izena + ')'}"></li></ul></article></main><script th:src="@{/js/ethazi.js}" defer></script><script th:src="@{/js/kiniela.js}" defer></script></body></html>
