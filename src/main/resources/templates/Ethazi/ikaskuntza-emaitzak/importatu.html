<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="eu">
<head th:replace="~{Ethazi/fragments/common :: head('Ikaskuntza Emaitzak PDFtik inportatu')}"></head>
<body class="ethazi-body">
<div th:replace="~{kudeatzaile/fragments/navbar :: kudeatzaile-navbar}"></div>
<nav th:replace="~{Ethazi/fragments/navbar :: navbar('ie-import')}"></nav>
<main class="page ethazi-page">
<div th:replace="~{Ethazi/fragments/common :: messages}"></div>
<header class="page-header"><div><h1>Ikaskuntza Emaitzak PDFtik inportatu</h1><p class="muted">Igo DCB/curriculum PDF bakarra. Datuak ez dira gordeko aurrebista baieztatu arte.</p></div></header>
<section class="ethazi-card import-help">
<h2>PDFa aztertu</h2>
<p>Parserrak modulu-kodeak eta ikaskuntza-emaitzen deskribapenak aterako ditu. <strong>a), b), c)… ebaluazio-irizpideak ez dira inportatuko.</strong></p>
<form class="form" th:action="@{/ethazi/ikaskuntza-emaitzak/importatu/aurrebista}" method="post" enctype="multipart/form-data">
<div class="field"><label for="hizkuntza">PDFaren hizkuntza</label><select id="hizkuntza" name="hizkuntza" required><option value="">— Aukeratu —</option><option th:each="h : ${hizkuntzak}" th:value="${h}" th:text="${h.etiketa}" th:selected="${h == aukeratutakoHizkuntza}"></option></select></div>
<div class="field"><label for="fitxategia">DCB/curriculum PDFa</label><input id="fitxategia" name="fitxategia" type="file" accept=".pdf,application/pdf" required><small class="muted">PDF bakarra, gehienez 8 MB.</small></div>
<button class="btn btn-primary" type="submit">Aurrebista sortu</button>
</form>
</section>
</main>
</body></html>
