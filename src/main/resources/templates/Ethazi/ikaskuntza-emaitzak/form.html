<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="eu">
<head th:replace="~{Ethazi/fragments/common :: head('Ikaskuntza-emaitza')}"></head>
<body class="ethazi-body">
<div th:replace="~{kudeatzaile/fragments/navbar :: kudeatzaile-navbar}"></div>
<nav th:replace="~{Ethazi/fragments/navbar :: navbar('ikaskuntza-emaitzak')}"></nav>
<main class="page ethazi-page">
<div th:replace="~{Ethazi/fragments/common :: messages}"></div>
<header class="page-header"><h1 th:text="${id == null ? 'Ikaskuntza-emaitza berria' : 'Ikaskuntza-emaitza editatu'}"></h1><a class="btn" th:href="@{/ethazi/ikaskuntza-emaitzak(zikloaId=${form.zikloaId},moduloaId=${form.moduloaId})}">Zerrendara</a></header>
<p class="empty-state" th:if="${form.zikloaId == null}">Aukeratu zikloa eta modulua zerrendako filtroetan.</p>
<form th:if="${form.zikloaId != null}" class="form ethazi-card" th:object="${form}" method="post" th:action="${id == null} ? @{/ethazi/ikaskuntza-emaitzak/berria} : @{/ethazi/ikaskuntza-emaitzak/{id}/editatu(id=${id})}">
<input type="hidden" th:field="*{zikloaId}"><div class="field"><label for="moduloaId">EEI kodea (moduluaren bidez)</label><select id="moduloaId" th:field="*{moduloaId}" required><option value="">— Aukeratu modulua —</option><option th:each="m : ${moduluak}" th:value="${m.id}" th:text="${m.eeiKodea} + ' · ' + ${m.izena}"></option></select></div>
<p class="muted">EEI kode bera duten modulu guztiek IE hau partekatzen dute. Bete gutxienez hizkuntza bateko deskribapena.</p><div class="field"><label for="kodea">Kodea</label><input id="kodea" th:field="*{kodea}" placeholder="RA1" maxlength="20" required></div>
<div class="field"><label for="ordena">Ordena</label><input id="ordena" type="number" min="1" max="2147483647" th:field="*{ordena}" required></div>
<div class="field"><label for="deskribapena">Deskribapena</label><div class="translation-editor"><label>Testuaren hizkuntza <select data-translation-select><option value="Eu">Euskara</option><option value="Es">Gaztelera</option><option value="En">Ingelera</option></select></label><div data-translation-panel="Eu"><span class="muted">Euskara</span><textarea aria-label="Euskara" id="deskribapena" th:field="*{deskribapena}" rows="6" maxlength="60000" ></textarea></div><div data-translation-panel="Es"><span class="muted">Gaztelera</span><textarea aria-label="Gaztelera" th:field="*{deskribapenaEs}" rows="6" maxlength="60000" ></textarea></div><div data-translation-panel="En"><span class="muted">Ingelera</span><textarea aria-label="Ingelera" th:field="*{deskribapenaEn}" rows="6" maxlength="60000" ></textarea></div></div></div><button class="btn btn-primary">Gorde</button></form>
</main>
<script th:src="@{/js/ethazi.js}" defer></script>
</body></html>
